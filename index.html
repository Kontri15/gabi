<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre Gabiku</title>
<meta name="description" content="Narodeninový darček pre Gabiku">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;500;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --sky:#1b1530;          /* dusk indigo ground */
    --sky-2:#2a1f45;        /* raised dusk */
    --ink:#f3ecff;          /* lilac-white text */
    --muted:#a99cc8;        /* faded lilac */
    --peach:#ffb48f;        /* apricot accent */
    --gold:#f5d58a;         /* star gold */
    --line:rgba(243,236,255,.14);
    --display:"Gloock", "Georgia", "Times New Roman", serif;
    --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{min-height:100%}
  body{
    margin:0;background:var(--sky);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 70% at 50% 0%, #3a2a5c 0%, var(--sky) 60%);
    background-attachment:fixed;
  }
  #stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

  /* ---------- gate ---------- */
  .gate{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    padding:24px 16px;background:rgba(20,15,36,.72);backdrop-filter:blur(6px);
    transition:opacity .9s ease, visibility .9s;
  }
  .gate.open{opacity:0;visibility:hidden}
  .tag{
    position:relative;width:min(340px,100%);text-align:center;
    padding:48px 28px 36px;border-radius:18px;
    background:linear-gradient(180deg,#2e2350,#221a3d);
    border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
  }
  .tag .hole{position:absolute;top:16px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--sky);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
  .tag .for{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0}
  .tag h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;margin:.2em 0 .4em;color:var(--ink);text-wrap:balance}
  .tag h2 .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:.85em}
  .tag p.hint{margin:0 0 28px;color:var(--muted);font-size:15px}
  .seal{
    appearance:none;border:0;cursor:pointer;font:inherit;
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 26px;border-radius:999px;
    background:var(--peach);color:#2a1433;font-weight:700;font-size:16px;
    box-shadow:0 8px 24px rgba(255,180,143,.35);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .seal:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,180,143,.5)}
  .seal:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
  .seal svg{width:18px;height:18px}

  /* ---------- page ---------- */
  main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:56px 40px}
  .hero{position:relative;text-align:center;padding-block:24px 8px}
  .libra{display:block;width:min(220px,55%);height:auto;margin:0 auto 8px;overflow:visible}
  .libra line{stroke:var(--gold);stroke-width:1;opacity:.55}
  .libra circle{fill:var(--gold)}
  .eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--peach);margin:0}
  h1{
    font-family:var(--display);font-weight:400;margin:.15em 0 .2em;
    font-size:clamp(48px,11vw,104px);line-height:.95;letter-spacing:-.01em;text-wrap:balance;
  }
  h1 em{font-style:normal;color:var(--peach)}
  .sub{color:var(--muted);margin:0 auto;max-width:46ch;font-size:17px}

  /* player */
  .player{
    margin:48px auto 0;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;
    padding:20px;border-radius:20px;background:rgba(42,31,69,.75);border:1px solid var(--line);
  }
  .disc{
    width:96px;height:96px;border-radius:50%;position:relative;flex:none;
    background:
      radial-gradient(circle at 50% 50%, var(--peach) 0 17%, #2a1433 17.5% 19%, transparent 19.5%),
      repeating-radial-gradient(circle at 50% 50%, #17112a 0 2px, #1f1836 2px 4px);
    box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.06);
    animation:spin 6s linear infinite;animation-play-state:paused;
  }
  .playing .disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ptop{display:flex;align-items:center;gap:14px;min-width:0}
  .play{
    appearance:none;border:0;cursor:pointer;flex:none;width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;background:var(--ink);color:var(--sky);
    transition:transform .15s ease;
  }
  .play:hover{transform:scale(1.06)}
  .play:focus-visible{outline:3px solid var(--peach);outline-offset:3px}
  .play svg{width:22px;height:22px}
  .meta{min-width:0}
  .meta .t{font-family:var(--display);font-size:22px;line-height:1.15;margin:0;overflow-wrap:anywhere}
  .meta .a{color:var(--muted);font-size:14px;margin:2px 0 0}
  .bar{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .track{position:relative;flex:1;height:6px;border-radius:6px;background:var(--line);cursor:pointer}
  .track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:linear-gradient(90deg,var(--peach),var(--gold))}
  .track input{position:absolute;inset:-8px 0;width:100%;opacity:0;cursor:pointer;margin:0}
  .track:focus-within{outline:2px solid var(--peach);outline-offset:4px}

  /* lyrics */
  .lyrics{margin-top:56px;text-align:center}
  .lyrics h3{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 28px}
  .part{margin:0 0 30px}
  .part .lab{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--peach);opacity:.8;margin-bottom:10px}
  .ln{
    display:block;margin:0 auto;max-width:34ch;
    font-family:var(--display);font-size:clamp(20px,4.2vw,27px);line-height:1.45;
    color:var(--ink);opacity:.42;transition:opacity .4s ease,color .4s ease,transform .4s ease;
    background:none;border:0;padding:2px 0;cursor:default;text-align:center;
  }
  .timed .ln{cursor:pointer}
  .ln.on{opacity:1;color:var(--peach);transform:scale(1.03)}
  .ln.past{opacity:.7}
  .untimed .ln{opacity:.92}

  /* note */
  .note{margin:64px auto 0;max-width:560px;padding:28px 26px;border-radius:18px;border:1px solid var(--line);background:rgba(27,21,48,.6)}
  .note p{margin:0 0 1em;font-size:17px}
  .note p:last-child{margin:0}
  .note .sig{font-family:var(--display);font-size:24px;color:var(--peach)}

  footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:13px;padding:24px 16px 48px}
  .again{appearance:none;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;padding:8px 16px;border-radius:999px;cursor:pointer;margin-top:10px}
  .again:hover{border-color:var(--peach)}
  .again:focus-visible{outline:2px solid var(--peach);outline-offset:3px}

  @media (max-width:480px){
    .player{grid-template-columns:1fr;justify-items:center;text-align:center}
    .ptop{flex-direction:column}
    .bar{width:100%}
    .disc{width:120px;height:120px}
  }
  @media (prefers-reduced-motion:reduce){
    .disc{animation:none}
    .ln,.gate{transition:none}
  }
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="gate" id="gate">
  <div class="tag" role="dialog" aria-labelledby="gateTitle">
    <span class="hole" aria-hidden="true"></span>
    <h2 id="gateTitle">For you Loove <span class="emo">🙂‍↔️</span></h2>
    <p class="hint">Máš tu malý darček. Zapni si zvuk.</p>
    <button class="seal" id="openBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zm0 0c2-4 6-4 6-1s-6 1-6 1z"/></svg>
      Otvor darček
    </button>
  </div>
</div>

<main id="main">
  <header class="hero">
    <svg class="libra" viewBox="0 0 200 150" aria-label="Súhvezdie Váh">
      <line x1="92" y1="14" x2="30" y2="62"/><line x1="92" y1="14" x2="150" y2="58"/>
      <line x1="30" y1="62" x2="150" y2="58"/><line x1="30" y1="62" x2="44" y2="128"/>
      <line x1="150" y1="58" x2="138" y2="112"/><line x1="138" y1="112" x2="168" y2="134"/>
      <circle cx="92" cy="14" r="4"/><circle cx="30" cy="62" r="3.6"/><circle cx="150" cy="58" r="3"/>
      <circle cx="44" cy="128" r="3"/><circle cx="138" cy="112" r="2.4"/><circle cx="168" cy="134" r="2.2"/>
    </svg>
    <p class="eyebrow" id="dateLine">Narodená pod Váhami</p>
    <h1>Všetko najlepšie, <em>Gabi</em></h1>
    <p class="sub">Namiesto prianí na papier som ti napísal pesničku. Pusti si ju nahlas.</p>
  </header>

  <section class="player" id="player" aria-label="Prehrávač">
    <div class="disc" aria-hidden="true"></div>
    <div>
      <div class="ptop">
        <button class="play" id="playBtn" type="button" aria-label="Prehrať">
          <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <div class="meta">
          <p class="t" id="songTitle">Gabka, Gabka</p>
          <p class="a">od Samuela</p>
        </div>
      </div>
      <div class="bar">
        <span id="cur">0:00</span>
        <div class="track"><div class="fill" id="fill"></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posun v pesničke"></div>
        <span id="dur">0:00</span>
      </div>
    </div>
    <audio id="song" src="song.mp3" preload="metadata"></audio>
  </section>

  <section class="lyrics" id="lyricsWrap" aria-label="Text piesne">
    <h3>Text</h3>
    <div id="lyrics"></div>
  </section>

  <section class="note" id="note" hidden>
    <div id="noteBody"></div>
    <p class="sig">Samuel</p>
  </section>
</main>

<footer>
  <div>S láskou, 2026</div>
  <button class="again" id="againBtn" type="button">Ešte raz konfety</button>
</footer>

<script>
/* ====== OBSAH – upravuj tu ====== */
const CONFIG = {
  songTitle: "Gabka, Gabka",
  dateLine: "Narodená pod Váhami",
  // [čas v sekundách alebo null, "riadok"]; riadky začínajúce "[" sú nadpisy častí
  lyrics: [
    [null, "[Intro]"],
    [6.7, "Gabka, Gabka, ja ťa ľúbim,"],
    [10.29, "ja ti vernú lásku sľúbim."],
    [13.8, "Gabka, Gabka, mám ťa rád,"],
    [17.47, "na líčko ťa pobozkám."],
    [null, "[1. sloha]"],
    [21.06, "Týždeň na stáži, brekfesty a autobus,"],
    [24.02, "vraj budeš kôš mediálky, zoberieš, čo nechcú brať."],
    [28.16, "Kamoši ma na Linktine trošku postalkovali,"],
    [31.36, "tak lístok na stôl pristál: „Nešiel by kôš na večeru?“"],
    [null, "[Refrén]"],
    [35.35, "Gaaabka, Gabka, všetko naj,"],
    [38.78, "Itáliu si užívaj,"],
    [41.97, "si krásna, lebo si, tak ako to stojí na tabuli,"],
    [47.79, "pochválim ťa, „Čo chceš?“"],
    [51.78, "Nič, len bozk na líčko, aj keď zas budem debil."],
    [null, "[2. sloha]"],
    [56.49, "Ňu Skúl, INFRA, Levl Trevl, Diplomat a k tomu škola,"],
    [60.24, "robíš za troch, no tváriš sa, že si lenivá."],
    [63.75, "Tvrďačku hráš, no pred Litvou si vyplakávala,"],
    [67.26, "dve hodiny tam a celá Litva ťa milovala."],
    [70.85, "Kilometre medzi nami, no Enola cez obrazovku."],
    [null, "[Refrén]"],
    [76.28, "Gaaabka, Gabka, všetko naj,"],
    [81.54, "Itáliu si užívaj,"],
    [84.73, "si krásna, lebo si, tak ako to stojí na tabuli,"],
    [92.15, "pochválim ťa, „Čo chceš?“"],
    [94.47, "Nič, len bozk na líčko, aj keď zas budem debil."],
    [null, "[Záver]"],
    [99.42, "Váhy berú domy, kamióny, prevody,"],
    [102.45, "ani na jedno ešte nemám, tak zatiaľ pesnička, dovtedy."],
    [105.8, "Stačí psík na ulici a už len..."],
    [113.54, "Uéééj... pu, pu, pu..."],
    [117.53, "Všetko najlepšie, Žabička, od tvojho cucflekového špecialistu."]
  ],
  note: [] // odstavce osobného odkazu; prázdne = sekcia sa skryje
};
/* ================================ */

const $ = id => document.getElementById(id);
$('songTitle').textContent = CONFIG.songTitle;
$('dateLine').textContent = CONFIG.dateLine;

/* lyrics */
const lines = [];
(function renderLyrics(){
  const root = $('lyrics');
  const timed = CONFIG.lyrics.some(l => typeof l[0] === 'number');
  root.className = timed ? 'timed' : 'untimed';
  let part = null;
  const newPart = label => {
    part = document.createElement('div'); part.className = 'part';
    if (label){ const s=document.createElement('span'); s.className='lab'; s.textContent=label; part.appendChild(s); }
    root.appendChild(part);
  };
  CONFIG.lyrics.forEach(([t, text]) => {
    const m = text.match(/^\[(.+)\]$/);
    if (m){ newPart(m[1]); return; }
    if (!part) newPart(null);
    const b = document.createElement(timed ? 'button' : 'span');
    if (timed) b.type = 'button';
    b.className = 'ln'; b.textContent = text;
    if (typeof t === 'number'){
      b.addEventListener('click', () => { audio.currentTime = t; audio.play(); });
      lines.push({t, el:b});
    }
    part.appendChild(b);
  });
  if (!CONFIG.lyrics.length) $('lyricsWrap').hidden = true;
})();

/* note */
if (CONFIG.note.length){
  $('note').hidden = false;
  CONFIG.note.forEach(p => { const el=document.createElement('p'); el.textContent=p; $('noteBody').appendChild(el); });
}

/* player */
const audio = $('song');
const fmt = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';
const setPlaying = on => {
  $('player').classList.toggle('playing', on);
  $('icoPlay').hidden = on; $('icoPause').hidden = !on;
  $('playBtn').setAttribute('aria-label', on ? 'Pozastaviť' : 'Prehrať');
};
$('playBtn').addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
audio.addEventListener('play', () => setPlaying(true));
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('loadedmetadata', () => $('dur').textContent = fmt(audio.duration));
let seeking = false;
$('seek').addEventListener('input', e => { seeking = true; if (audio.duration) audio.currentTime = e.target.value/1000*audio.duration; });
$('seek').addEventListener('change', () => seeking = false);
let lastIdx = -1;
audio.addEventListener('timeupdate', () => {
  const p = audio.duration ? audio.currentTime/audio.duration : 0;
  $('fill').style.width = (p*100)+'%';
  if (!seeking) $('seek').value = Math.round(p*1000);
  $('cur').textContent = fmt(audio.currentTime);
  if (!lines.length) return;
  let idx = -1;
  for (let i=0;i<lines.length;i++){ if (audio.currentTime + 0.15 >= lines[i].t) idx = i; else break; }
  if (idx !== lastIdx){
    lines.forEach((l,i) => { l.el.classList.toggle('on', i===idx); l.el.classList.toggle('past', i<idx); });
    if (idx >= 0 && !audio.paused){
      const r = lines[idx].el.getBoundingClientRect();
      if (r.top < innerHeight*0.25 || r.bottom > innerHeight*0.8)
        lines[idx].el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center'});
    }
    lastIdx = idx;
  }
});
audio.addEventListener('ended', () => { lines.forEach(l => l.el.classList.remove('on','past')); lastIdx=-1; });

/* stars */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sc = $('stars'), sx = sc.getContext('2d');
let stars = [];
function sizeCanvas(c){ const d=Math.min(devicePixelRatio||1,2); c.width=innerWidth*d; c.height=innerHeight*d; c.getContext('2d').setTransform(d,0,0,d,0,0); }
function initStars(){
  sizeCanvas(sc);
  const n = Math.round(innerWidth*innerHeight/5200);
  stars = Array.from({length:n}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:Math.random()*1.3+.2, p:Math.random()*Math.PI*2, s:.4+Math.random()*1.2}));
}
function drawStars(t){
  sx.clearRect(0,0,innerWidth,innerHeight);
  for (const s of stars){
    const a = reduce ? .6 : .35 + .45*Math.sin(t/1000*s.s + s.p);
    sx.globalAlpha = Math.max(.08,a); sx.fillStyle = '#f3ecff';
    sx.beginPath(); sx.arc(s.x,s.y,s.r,0,Math.PI*2); sx.fill();
  }
  sx.globalAlpha = 1;
  if (!reduce) requestAnimationFrame(drawStars);
}
initStars(); requestAnimationFrame(drawStars);
addEventListener('resize', () => { initStars(); sizeCanvas(cc); if (reduce) drawStars(0); });

/* confetti */
const cc = $('confetti'), cx = cc.getContext('2d');
sizeCanvas(cc);
let bits = [], running = false;
const COLS = ['#ffb48f','#f5d58a','#f3ecff','#c9a7ff','#ff8fb1'];
function burst(){
  if (reduce) return;
  const W = innerWidth, H = innerHeight;
  for (let i=0;i<180;i++){
    const ang = -Math.PI/2 + (Math.random()-.5)*Math.PI*.9;
    const sp = 7 + Math.random()*9;
    bits.push({x:W/2, y:H*.55, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, w:5+Math.random()*6, h:8+Math.random()*8,
      rot:Math.random()*6, vr:(Math.random()-.5)*.35, c:COLS[i%COLS.length], life:0});
  }
  if (!running){ running = true; requestAnimationFrame(stepConfetti); }
}
function stepConfetti(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  bits = bits.filter(b => b.y < innerHeight+40 && b.life < 400);
  for (const b of bits){
    b.vy += .22; b.vx *= .985; b.vy *= .985; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life++;
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.rot); cx.fillStyle=b.c;
    cx.fillRect(-b.w/2,-b.h/2*Math.abs(Math.cos(b.rot*2)),b.w,b.h*Math.abs(Math.cos(b.rot*2))+1);
    cx.restore();
  }
  if (bits.length) requestAnimationFrame(stepConfetti); else { running = false; cx.clearRect(0,0,innerWidth,innerHeight); }
}

/* gate */
$('openBtn').addEventListener('click', () => {
  $('gate').classList.add('open');
  burst(); setTimeout(burst, 450);
  audio.play().catch(()=>{});
});
$('againBtn').addEventListener('click', burst);
$('openBtn').focus();
</script>
</body>
</html>
